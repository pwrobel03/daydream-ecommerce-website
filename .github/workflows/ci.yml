name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# lib/env.ts waliduje konfigurację przy imporcie, więc `next build` i testy
# potrzebują kompletu zmiennych o poprawnym formacie. To wartości pozorne —
# nic tu nie łączy się z zewnętrznym serwisem.
env:
  DATABASE_URL: postgresql://daydream:daydream@localhost:5432/daydream_ci
  UPLOAD_DIR: ./storage/uploads-ci
  REDIS_URL: redis://localhost:6379
  AUTH_SECRET: ci-auth-secret-value
  AUTH_URL: http://localhost:3000
  AUTH_TRUST_HOST: "true"
  AUTH_GOOGLE_ID: ci
  AUTH_GOOGLE_SECRET: ci
  AUTH_GITHUB_ID: ci
  AUTH_GITHUB_SECRET: ci
  STRIPE_SECRET_KEY: sk_test_ci
  STRIPE_WEBHOOK_SECRET: whsec_ci
  SMTP_HOST: localhost
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  MAIL_FROM: Daydream <ci@example.com>
  CRON_SECRET: ci-cron-secret-value
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  build:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Testcontainers samo podnosi PostgreSQL — runner ma dostępnego Dockera.
      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
