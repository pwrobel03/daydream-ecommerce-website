# Własna nazwa projektu, nie domyślna z katalogu. Bez niej ten plik dzieli
# przestrzeń nazw z docker-compose.yml — te same usługi (postgres, redis,
# mailpit) — więc `down -v` sprzątające po testach kasowało kontenery i wolumeny
# działającego lokalnie stosu razem z jego bazą.
name: daydream-e2e

# Zależności na czas testów E2E. Celowo na innych portach niż domyślne,
# żeby nie kolidować z lokalnym Postgresem czy Redisem.
# Healthcheck: szybko tylko na starcie (start_interval), potem rzadko — dwa
# równoległe przebiegi nie mogą zalać maszyny procesami sprawdzającymi.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: daydream
      POSTGRES_PASSWORD: daydream
      POSTGRES_DB: daydream_e2e
    ports:
      - "${E2E_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daydream -d daydream_e2e"]
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "${E2E_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${E2E_SMTP_PORT:-51025}:1025"
      - "${E2E_MAILPIT_PORT:-58025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      start_period: 30s
      start_interval: 1s
      interval: 30s
      timeout: 5s
      retries: 3
