# Zależności na czas testów E2E. Celowo na innych portach niż domyślne,
# żeby nie kolidować z lokalnym Postgresem czy Redisem.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: daydream
      POSTGRES_PASSWORD: daydream
      POSTGRES_DB: daydream_e2e
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daydream -d daydream_e2e"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "51025:1025"
      - "58025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15
