# Uruchomienie całego projektu jednym poleceniem:
#
# UWAGA: bez interpolacji ${...} celowo. Compose automatycznie wczytuje `.env`
# z katalogu projektu do podstawiania zmiennych, a deweloperski `.env` zawiera
# sekrety ze znakami `$`, na których interpolacja się wykłada
# ("The \"w8JE\" variable is not set"). Konfiguracja aplikacji idzie przez
# env_file: .env.docker, a wartości poniżej są tu wpisane wprost.
#
#   cp .env.docker.example .env.docker   # uzupełnij klucze Stripe/Resend
#   docker compose up
#
# Aplikacja sama wykona migracje przy starcie. RUN_SEED=true wypełnia bazę
# katalogiem demonstracyjnym przy pierwszym uruchomieniu.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: daydream
      POSTGRES_PASSWORD: daydream
      POSTGRES_DB: daydream
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daydream -d daydream"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://daydream:daydream@postgres:5432/daydream
      REDIS_URL: redis://redis:6379
      # Katalog uploadu leży na wolumenie, poza obrazem — bez tego wgrane
      # zdjęcia znikałyby przy każdym odtworzeniu kontenera.
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  uploads:
