# Reverse proxy dla wdrożenia produkcyjnego.
# Aplikacja nasłuchuje wyłącznie w sieci wewnętrznej compose; na zewnątrz
# wystawiony jest tylko ten serwer.

upstream daydream_app {
    server app:3000;
    keepalive 32;
}

# Wymuszenie HTTPS. Ścieżka ACME zostaje na HTTP, bo certbot jej potrzebuje.
server {
    listen 80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Upload zdjęć produktu idzie jednym żądaniem wieloczęściowym; limit musi
    # być spójny z serverActions.bodySizeLimit w next.config.ts.
    client_max_body_size 50m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Pliki wgrane przez panel. Nazwy to UUID-y, więc treść nigdy się nie zmienia.
    location /uploads/ {
        proxy_pass http://daydream_app;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://daydream_app;
        proxy_http_version 1.1;

        # Bez tych nagłówków rate limiting widzi adres proxy zamiast klienta,
        # a Auth.js buduje callbacki po wewnętrznym hoście.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
    }
}
